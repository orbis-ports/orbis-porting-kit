# The kit builds something with its own copies, or the copies are worth nothing.
#
# ⚠ THE `copies` JOB IS GONE, AND THAT IS THE POINT RATHER THAN A DELETION. It compared this
# repository's files against orbis-compat's byte for byte, because for one day they lived in both.
# They do not any more: cmake/, vkloader/, the examples and orbis-new.sh are this repository's, and
# the overlay ships include/ and an archive. A test that compares a file against nothing is worse
# than no test, so it went with the thing it was watching.
#
# ⚠ WHAT THIS DOES NOT YET PROVE. The toolchain file reaches back into ORBIS_COMPAT_DIR for
# cmake/orbis-tls.ld and cmake/orbis-compat.cmake (see ps4-openorbis.cmake:107 and :201), so the
# kit's copies of those two are carried but not exercised. Closing that is phase 2, not a thing to
# paper over here.
name: kit

on:
  push:
  pull_request:
  workflow_dispatch:

# ⚠ SHAS, NEVER BRANCHES. A cache key that can mean two different trees serves yesterday's overlay
# against today's headers, and that failure mode has already cost this project a day.
#
# The Mesa release is the one OpenGothic and RetroArch are pinned to today. It was built against
# orbis-compat cc75949, and ORBIS_COMPAT_REF below is newer - that is the same pair every port in
# the org builds green with, because `git diff cc75949..6af90a8 -- include/` is empty.
env:
  ORBIS_COMPAT_REF: 6af90a8600464af4e29b384a9533e8284c14c625
  MESA_RELEASE: orbis-mesa-4c934ebf9cda

jobs:
  triangle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: glslang
        # The SDK ships no shader compiler and neither does the kit: SPIR-V is built here and
        # embedded, so the console loads no files.
        run: |
          set -euo pipefail
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 glslang-tools

      - name: The toolchain, the overlay and Mesa
        id: orbis
        uses: ./.github/actions/setup-orbis
        with:
          orbis-compat-ref: ${{ env.ORBIS_COMPAT_REF }}
          mesa-release: ${{ env.MESA_RELEASE }}

      - name: Configure and build with the kit's own toolchain file and vkloader
        run: |
          set -euo pipefail
          # ⚠ -D, NOT THE ENVIRONMENT, FOR THE TWO MESA PATHS. setup-orbis exports ORBIS_MESA_SRC
          # and ORBIS_MESA_BUILD into $GITHUB_ENV, but vkloader/CMakeLists.txt reads the CMake
          # variables only - its own error says "every entry point passes -DORBIS_MESA_BUILD
          # explicitly; reaching this message means one did not", and the first run of this
          # workflow was exactly that. A kit whose entry point requires the caller to know this is
          # a kit with a missing piece; the piece belongs in a helper here, and until it exists the
          # workflow does what the other ports' build scripts already do.
          cmake -S examples/triangle -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ps4-openorbis.cmake" \
            -DORBIS_KIT_DIR="$GITHUB_WORKSPACE" \
            -DORBIS_MESA_SRC="$ORBIS_MESA_SRC" \
            -DORBIS_MESA_BUILD="$ORBIS_MESA_BUILD"
          cmake --build build

      - name: What came out
        # An eboot that exists is the claim; its size and its type are the evidence. A build that
        # "succeeded" and produced nothing is a real failure mode here - create-fself resolving to
        # nothing used to be a warning, and the run carried on past it.
        run: |
          set -euo pipefail
          find build -name 'eboot.bin' -o -name '*.elf' -o -name '*.oelf' | sort
          eboot="$(find build -name 'eboot.bin' | head -1)"
          [ -n "$eboot" ] || { echo "!! no eboot.bin: the toolchain file configured but produced no image" >&2; exit 1; }
          ls -l "$eboot"; file "$eboot" || true

      # ⚠ COMPILED FOR THE CONSOLE, WITH NO ENGINE AROUND THEM. That is the whole assertion: these
      # were lifted out of a game, and a service that only compiles inside the tree it came from was
      # not extracted, it was moved twice.
      # hello needs no Mesa, no loader and no shader compiler - that is its whole point, and why it
      # is the example that says whether the LAYOUT is right when the graphics stack is what broke.
      - name: hello, the layout check
        run: |
          set -euo pipefail
          cmake -S examples/hello -B build-hello -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ps4-openorbis.cmake"
          cmake --build build-hello
          find build-hello -name 'eboot.bin' -o -name '*.oelf' | sort

      - name: The platform services compile on their own
        run: |
          set -euo pipefail
          cmake -S services -B build-services -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ps4-openorbis.cmake"
          cmake --build build-services
          ar t build-services/liborbis-services.a
          llvm-nm -g --defined-only build-services/liborbis-services.a | grep -c 'orbis' || true

      - uses: actions/upload-artifact@v4
        with:
          name: triangle
          path: |
            build/**/eboot.bin
            build/**/*.pkg
          if-no-files-found: warn
